<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Frame</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<h1>My Frame</h1>

<form id="formEntrada">
  <textarea id="texto" placeholder="Escribe tu entrada..." required></textarea>

  <div class="form-grid">
    <label class="field-label" for="estado">Estado</label>
    <select id="estado">
      <option value="">Sin estado</option>
    </select>

    <label class="field-label" for="actividadesToggle">Actividades</label>
    <div class="activity-select">
      <button type="button" id="actividadesToggle" class="select-like">Seleccionar actividades ▾</button>
      <div id="actividadesMenu" class="activity-menu"></div>
      <div id="actividadesResumen" class="activity-summary">Sin actividades</div>
    </div>
  </div>

  <div class="activity-management">
    <button type="button" id="toggleActividades" class="btn-outline">Gestionar actividades</button>
    <div id="gestionActividades" class="management-panel">
      <button type="button" id="agregarActividad" class="btn-real">+ Nueva actividad</button>
      <div id="listaActividades"></div>
    </div>
  </div>

  <div class="button-group">
    <label for="fotos" class="btn-fake">📷 Seleccionar fotos</label>
    <input type="file" id="fotos" accept="image/*" multiple style="display:none;">

    <button type="submit" class="btn-real">Guardar Entrada</button>
    <button type="button" id="cancelarEdicion" class="btn-outline" hidden>Cancelar edición</button>
  </div>

  <button type="button" id="exportarPDF" class="btn-outline">Exportar PDF</button>
</form>

<div id="listaEntradas"></div>

<div id="modalImagen" class="modal">
  <div class="modal-content">
    <span id="cerrarModal" class="close-btn">&times;</span>
    <img id="modalImg" src="" alt="Vista completa">
  </div>
</div>

<script src="libs/jspdf.umd.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
